<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta
      name="description"
      content="Dashboard Porsche Sales Intelligence — projeto desenvolvido para o desafio da DIO com apoio de agentes de IA."
    />
    <title>Dashboard Porsche | Sales Intelligence</title>
    <link rel="canonical" href="https://porsche-sales-intelligence-dio.elis23-eng.chatgpt.site" />
    <meta http-equiv="refresh" content="0; url=https://porsche-sales-intelligence-dio.elis23-eng.chatgpt.site" />
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, Helvetica, sans-serif;
        background: #0b0b0b;
        color: #fff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 80% 20%, rgba(213, 0, 28, 0.22), transparent 34rem),
          #0b0b0b;
      }

      main {
        width: min(42rem, calc(100% - 2rem));
        padding: 3rem;
        border: 1px solid #2b2b2b;
        border-radius: 1.5rem;
        background: rgba(22, 22, 22, 0.92);
        text-align: center;
      }

      .brand {
        margin: 0 0 1.5rem;
        letter-spacing: 0.5rem;
        font-size: 1rem;
      }

      h1 {
        margin: 0 0 1rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 5vw, 3.5rem);
        font-weight: 400;
      }

      p { color: #c7c7c7; line-height: 1.6; }

      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.9rem 1.3rem;
        border-radius: 0.5rem;
        background: #d5001c;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">PORSCHE</p>
      <h1>Sales Intelligence</h1>
      <p>Redirecionando para o dashboard interativo.</p>
      <a href="https://porsche-sales-intelligence-dio.elis23-eng.chatgpt.site">Abrir dashboard</a>
    </main>
    <script>
      window.location.replace("https://porsche-sales-intelligence-dio.elis23-eng.chatgpt.site");
    </script>
  </body>
</html>
